services:
  back:
    build:
      context: .
      dockerfile: back/Dockerfile
      target: production
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3001
      SWAGGER_ENABLED: "true"
      SWAGGER_PATH: docs
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_MAX: "1"
      DATABASE_IDLE_TIMEOUT_MS: "10000"
      DATABASE_CONNECTION_TIMEOUT_MS: "2000"
      DATABASE_STATEMENT_TIMEOUT_MS: "5000"
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-require}
      CONTACT_HASH_KEY: ${CONTACT_HASH_KEY:-}
      CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY:-}
      VERIFICATION_SECRET_KEY: ${VERIFICATION_SECRET_KEY:-}
      REGISTRATION_FLOW_SECRET: ${REGISTRATION_FLOW_SECRET:-}
      BFF_INTERNAL_TOKEN: ${BFF_INTERNAL_TOKEN:-}
      REGISTRATION_HTTP_ENABLED: ${REGISTRATION_HTTP_ENABLED:-false}
      # SDD-013 (ADR-033..035): keep false until migration 0006 and the BFF are ready.
      AUTH_HTTP_ENABLED: ${AUTH_HTTP_ENABLED:-false}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      VERIFICATION_DELIVERY_MODE: brevo
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_BASE_URL: ${BREVO_BASE_URL:-https://api.brevo.com/v3}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-}
    ports:
      - "${BACK_PORT:-3001}:3001"
