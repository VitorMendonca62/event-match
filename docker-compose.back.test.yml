services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventmatch}
      POSTGRES_USER: ${POSTGRES_USER:-eventmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # E2E-only stand-in for the Brevo API (ADR-026); nothing leaves the Compose network.
  fake-brevo:
    build:
      context: .
      dockerfile: back/Dockerfile
      target: development
    command: bun back/test/support/fake-brevo-server.ts
    environment:
      FAKE_BREVO_PORT: "4010"
    ports:
      - "${FAKE_BREVO_HOST_PORT:-0}:4010"

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
      target: development
    command: bun run --cwd back start:dev
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: test
      PORT: 3001
      SWAGGER_ENABLED: "true"
      SWAGGER_PATH: docs
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_MAX: "1"
      DATABASE_IDLE_TIMEOUT_MS: "10000"
      # The origin-rate-limit E2E test intentionally sends 30 concurrent requests through
      # the production-shaped single-connection pool; queue them instead of producing 500s.
      DATABASE_CONNECTION_TIMEOUT_MS: "10000"
      DATABASE_STATEMENT_TIMEOUT_MS: "5000"
      DATABASE_SSL_MODE: disable
      CONTACT_HASH_KEY: ${CONTACT_HASH_KEY:-}
      CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY:-}
      VERIFICATION_SECRET_KEY: ${VERIFICATION_SECRET_KEY:-}
      REGISTRATION_FLOW_SECRET: ${REGISTRATION_FLOW_SECRET:-}
      BFF_INTERNAL_TOKEN: ${BFF_INTERNAL_TOKEN:-}
      REGISTRATION_HTTP_ENABLED: "true"
      VERIFICATION_DELIVERY_MODE: brevo
      BREVO_API_KEY: xkeysib-fake-e2e-only
      BREVO_BASE_URL: http://fake-brevo:4010/v3
      EMAIL_FROM: EventMatch <nao-responda@example.test>
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      # SDD-013: the runners generate a disposable session secret; policies default to production values.
      AUTH_HTTP_ENABLED: "true"
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      PROFILE_HTTP_ENABLED: "true"
      PROFILE_MEDIA_ENABLED: ${PROFILE_MEDIA_ENABLED:-false}
      PROFILE_MEDIA_PROVIDER: ${PROFILE_MEDIA_PROVIDER:-cloudinary}
      PROFILE_INVITATION_KEY: ${PROFILE_INVITATION_KEY:-}
      PROFILE_MEDIA_KEY: ${PROFILE_MEDIA_KEY:-}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      AUTH_LOGIN_ORIGIN_LIMIT: ${AUTH_LOGIN_ORIGIN_LIMIT:-30}
      AUTH_SESSION_RENEWAL_INTERVAL_SECONDS: ${AUTH_SESSION_RENEWAL_INTERVAL_SECONDS:-86400}
      AUTH_SESSION_PREVIOUS_TOKEN_GRACE_SECONDS: ${AUTH_SESSION_PREVIOUS_TOKEN_GRACE_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      fake-brevo:
        condition: service_started
    ports:
      - "${BACK_PORT:-0}:3001"
