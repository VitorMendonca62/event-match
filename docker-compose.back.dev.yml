services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventmatch}
      POSTGRES_USER: ${POSTGRES_USER:-eventmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  back:
    build:
      context: .
      dockerfile: back/Dockerfile
      target: development
    command: bun run --cwd back start:dev
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      PORT: 3001
      SWAGGER_ENABLED: "true"
      SWAGGER_PATH: docs
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_MAX: "1"
      DATABASE_IDLE_TIMEOUT_MS: "10000"
      DATABASE_CONNECTION_TIMEOUT_MS: "2000"
      DATABASE_STATEMENT_TIMEOUT_MS: "5000"
      DATABASE_SSL_MODE: disable
      CONTACT_HASH_KEY: ${CONTACT_HASH_KEY:-}
      CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY:-}
      VERIFICATION_SECRET_KEY: ${VERIFICATION_SECRET_KEY:-}
      REGISTRATION_FLOW_SECRET: ${REGISTRATION_FLOW_SECRET:-}
      BFF_INTERNAL_TOKEN: ${BFF_INTERNAL_TOKEN:-}
      REGISTRATION_HTTP_ENABLED: ${REGISTRATION_HTTP_ENABLED:-false}
      # SDD-013 (ADR-033..035): keep false until migration 0006 and the BFF are ready.
      AUTH_HTTP_ENABLED: ${AUTH_HTTP_ENABLED:-false}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      PROFILE_HTTP_ENABLED: ${PROFILE_HTTP_ENABLED:-false}
      PROFILE_MEDIA_ENABLED: ${PROFILE_MEDIA_ENABLED:-false}
      PROFILE_INVITATION_KEY: ${PROFILE_INVITATION_KEY:-}
      PROFILE_MEDIA_KEY: ${PROFILE_MEDIA_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_PROFILE_UPLOAD_PRESET: ${CLOUDINARY_PROFILE_UPLOAD_PRESET:-}
      VERIFICATION_DELIVERY_MODE: ${VERIFICATION_DELIVERY_MODE:-noop}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_BASE_URL: ${BREVO_BASE_URL:-https://api.brevo.com/v3}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACK_PORT:-3001}:3001"
    volumes:
      - .:/app
      - back_node_modules:/app/node_modules

volumes:
  back_node_modules:
