services:
  back:
    build:
      context: .
      dockerfile: back/Dockerfile
      target: development
    command: bun run --cwd back start:dev
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      PORT: 3001
      SWAGGER_ENABLED: "true"
      SWAGGER_PATH: docs
    ports:
      - "${BACK_PORT:-3001}:3001"
    volumes:
      - .:/app
      - back_node_modules:/app/node_modules

volumes:
  back_node_modules:
