services:
  front:
    build:
      context: .
      dockerfile: front/Dockerfile
      target: production
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-}
      BFF_INTERNAL_TOKEN: ${BFF_INTERNAL_TOKEN:-}
      ORIGIN_FINGERPRINT_KEY: ${ORIGIN_FINGERPRINT_KEY:-}
      EDGE_PROVIDER: ${EDGE_PROVIDER:-vercel}
      AUTH_UI_ENABLED: ${AUTH_UI_ENABLED:-false}
    ports:
      - "${FRONT_PORT:-3000}:3000"
